    /* <div> у CSS-коментарі - не тег */
    p > a { color: red; }
  </style>
  <script>
    // "<div>" і a<b у JavaScript - теж не теги
    if (1 < 2) { document.write("<div class='fake'></div>"); }
  </script>
</head>

  <!-- <p>закоментований абзац</p> -->
  <div id="main">

    <p>Другий абзац<br/>з переносом<br>рядка.</p>
    <img src="x.png" alt="x"/>

      <li><a href="/1">Один</a></li>
      <li><a href="/2">Два</a></li>
      <li>Три</li>
    </ul>

</body>
</HTML>
